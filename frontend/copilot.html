<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulatory Copilot - AI Compliance Intelligence</title>
    <link rel="stylesheet" href="copilot.css">
    <style>
        /* Pure Blank White Canvas Style */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff !important;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            overflow: hidden;
        }

        .blank-canvas-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .blank-brand-icon {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 1px solid #bfdbfe;
        }

        .blank-canvas-center h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 8px 0;
        }

        .blank-canvas-center p {
            font-size: 0.95rem;
            color: #64748b;
            margin: 0 0 24px 0;
            max-width: 420px;
        }

        .blank-open-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
        }

        .blank-open-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>
    <!-- Minimal Center Launcher on Blank White Page -->
    <div class="blank-canvas-center">
        <div class="blank-brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L3 7V12C3 17.523 7.02 22.5 12 24C16.98 22.5 21 17.523 21 12V7L12 2Z"/>
                <path d="M9 12L11 14L15 10"/>
            </svg>
        </div>
        <h1>Regulatory Copilot</h1>
        <p>Click below or use the floating button at bottom-right to open the 50% split-view compliance assistant.</p>
        <button type="button" class="blank-open-btn" onclick="window.copilotInstance && window.copilotInstance.open()">
            <span>Open Copilot (50% Split)</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </div>

    <!-- Embedded Regulatory Copilot Mount Point -->
    <div id="copilotWidget"></div>

    <script src="copilot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.RegulatoryCopilot) {
                window.copilotInstance = window.RegulatoryCopilot.mount('#copilotWidget', {
                    apiBase: 'http://127.0.0.1:8000',
                    mode: 'drawer'
                });
            }
        });
    </script>
</body>
</html>
